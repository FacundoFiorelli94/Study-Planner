<div class="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-6 bg-black/80 backdrop-blur-sm animate-in fade-in">
  <div class="relative w-full max-w-xl max-h-[90vh] flex flex-col rounded-2xl bg-[#161822] border border-[#2a2e40] shadow-2xl overflow-hidden">
    
    <!-- Encabezado del Modal -->
    <div class="px-5 py-4 border-b border-[#242838] flex items-center justify-between bg-[#141620]">
      <div class="space-y-0.5">
        <span class="tui-badge" data-appearance="accent">Generador Inteligente</span>
        <h2 class="text-base font-bold text-white">Diseñar Nueva Ruta de Estudio con IA</h2>
      </div>

      <button
        type="button"
        (click)="close.emit()"
        class="text-slate-400 hover:text-white"
      >
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      </button>
    </div>

    <!-- Formulario -->
    <form (submit)="generateRoadmap(); $event.preventDefault()" class="flex-1 overflow-y-auto p-5 sm:p-6 space-y-4 bg-[#0f1118]">
      <div>
        <label class="text-xs text-slate-300 font-semibold block mb-1">
          Objetivo o Tecnología Principal a Dominar:
        </label>
        <input
          type="text"
          [(ngModel)]="topic"
          name="topic"
          placeholder="Ej: LangGraph & Agentes Multi-Agente en Python, o Kubernetes para MLOps"
          required
          class="w-full bg-[#161824] border border-[#262a3a] rounded-xl px-3.5 py-2.5 text-xs text-white outline-none focus:border-indigo-500"
        />
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="text-xs text-slate-300 font-semibold block mb-1">
            Horas disponibles por semana: ({{ weeklyHours }}h)
          </label>
          <input
            type="range"
            min="4"
            max="30"
            step="1"
            [(ngModel)]="weeklyHours"
            name="weeklyHours"
            class="w-full accent-indigo-500 cursor-pointer"
          />
        </div>

        <div>
          <label class="text-xs text-slate-300 font-semibold block mb-1">
            Duración objetivo (semanas):
          </label>
          <input
            type="number"
            min="4"
            max="52"
            [(ngModel)]="targetWeeks"
            name="targetWeeks"
            class="w-full bg-[#161824] border border-[#262a3a] rounded-xl px-3 py-2 text-xs text-white outline-none focus:border-indigo-500"
          />
        </div>
      </div>

      <div>
        <label class="text-xs text-slate-300 font-semibold block mb-1">Nivel actual de partida:</label>
        <select
          [(ngModel)]="currentLevel"
          name="currentLevel"
          class="w-full bg-[#161824] border border-[#262a3a] rounded-xl px-3 py-2 text-xs text-white outline-none"
        >
          <option value="Principiante">Principiante (Desde cero)</option>
          <option value="Intermedio">Intermedio (Con bases previas)</option>
          <option value="Avanzado">Avanzado (Especialización profunda)</option>
        </select>
      </div>

      <div>
        <label class="text-xs text-slate-300 font-semibold block mb-1">Días preferidos:</label>
        <div class="flex flex-wrap gap-1.5">
          @for (day of allDays; track day) {
            <button
              type="button"
              (click)="toggleDay(day)"
              [class]="selectedDays.includes(day) ? 'bg-indigo-600 text-white border-indigo-500' : 'bg-[#151722] text-slate-400 border-[#282c3c]'"
              class="border px-2.5 py-1 rounded-lg text-xs font-medium transition-all"
            >
              {{ day }}
            </button>
          }
        </div>
      </div>

      <div>
        <label class="text-xs text-slate-300 font-semibold block mb-1">Notas adicionales o contexto laboral:</label>
        <textarea
          [(ngModel)]="notes"
          name="notes"
          rows="2"
          placeholder="Ej: Necesito construir proyectos aplicados para presentar a empresas fintech"
          class="w-full bg-[#161824] border border-[#262a3a] rounded-xl p-3 text-xs text-white outline-none focus:border-indigo-500"
        ></textarea>
      </div>

      @if (errorMessage()) {
        <div class="p-3 rounded-lg bg-rose-500/15 border border-rose-500/30 text-rose-300 text-xs">
          {{ errorMessage() }}
        </div>
      }

      <div class="flex justify-end gap-2 pt-3 border-t border-[#242838]">
        <button
          type="button"
          (click)="close.emit()"
          class="tui-btn tui-btn-flat px-4 py-2 text-xs"
        >
          Cancelar
        </button>

        <button
          type="submit"
          [disabled]="isLoading() || !topic.trim()"
          class="tui-btn tui-btn-primary px-5 py-2 text-xs font-bold disabled:opacity-40"
        >
          {{ isLoading() ? 'Diseñando Ruta con Gemini...' : 'Generar Ruta Completa' }}
        </button>
      </div>
    </form>
  </div>
</div>
