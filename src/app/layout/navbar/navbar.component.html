<header class="sticky top-0 z-40 bg-[#16181f]/95 backdrop-blur-md border-b border-[#252834]">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4 sm:gap-8">
    
    <!-- Zona 1: Logo e Identidad -->
    <div class="flex items-center gap-3 shrink-0">
      <div [class]="'w-9 h-9 rounded-xl ' + activeThemeMeta.buttonClass + ' flex items-center justify-center transition-all duration-300 shadow-md relative overflow-hidden group'">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z" />
          <path d="M6 6h10" />
          <path d="M6 10h7" />
          <path d="m14 14 2 2 4-4" />
        </svg>
      </div>
      <div class="flex flex-col">
        <span class="text-base sm:text-lg font-bold tracking-tight text-slate-100 whitespace-nowrap flex items-center gap-1.5">
          <span>Study Planner</span>
          <span class="tui-badge" data-appearance="accent">
            AI
          </span>
        </span>
        <span class="text-[11px] text-slate-400 font-medium truncate max-w-[150px] sm:max-w-[220px]">
          {{ storage.activeRoadmap().title }}
        </span>
      </div>
    </div>

    <!-- Zona 2: Navegación de Pestañas (Taiga UI Tabs) -->
    <nav class="hidden md:flex items-center gap-1 h-full pt-1" aria-label="Pestañas principales">
      <button
        (click)="selectTab('roadmap')"
        [class.tui-tab_active]="currentTab() === 'roadmap'"
        class="tui-tab"
      >
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" />
          <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" />
        </svg>
        <span>Rutas & Módulos</span>
      </button>

      <button
        (click)="selectTab('planner')"
        [class.tui-tab_active]="currentTab() === 'planner'"
        class="tui-tab"
      >
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
          <line x1="16" y1="2" x2="16" y2="6" />
          <line x1="8" y1="2" x2="8" y2="6" />
          <line x1="3" y1="10" x2="21" y2="10" />
        </svg>
        <span>Planificador</span>
      </button>

      <button
        (click)="selectTab('progress')"
        [class.tui-tab_active]="currentTab() === 'progress'"
        class="tui-tab"
      >
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="20" x2="18" y2="10" />
          <line x1="12" y1="20" x2="12" y2="4" />
          <line x1="6" y1="20" x2="6" y2="14" />
        </svg>
        <span>Dashboard</span>
      </button>

      <button
        (click)="selectTab('chat')"
        [class.tui-tab_active]="currentTab() === 'chat'"
        class="tui-tab"
      >
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
        </svg>
        <span>Mentor IA</span>
      </button>
    </nav>

    <!-- Zona 3: Acciones Rápidas -->
    <div class="flex items-center gap-2 sm:gap-3">
      <!-- Botón Pomodoro -->
      <button
        (click)="openTimer.emit()"
        class="tui-btn tui-btn-secondary px-2.5 py-1.5 sm:px-3 text-xs"
        title="Iniciar temporizador Pomodoro"
      >
        <svg class="w-3.5 h-3.5 text-indigo-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10" />
          <polyline points="12 6 12 12 16 14" />
        </svg>
        <span class="hidden sm:inline">Focus</span>
      </button>

      <!-- Botón Nueva Ruta -->
      <button
        (click)="openNewRoadmap.emit()"
        class="tui-btn tui-btn-primary px-2.5 py-1.5 sm:px-3 text-xs"
      >
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="12" y1="5" x2="12" y2="19" />
          <line x1="5" y1="12" x2="19" y2="12" />
        </svg>
        <span class="hidden sm:inline">+ Nueva Ruta</span>
      </button>

      <!-- Campana Notificaciones -->
      <button
        (click)="openNotifications.emit()"
        class="relative p-2 rounded-lg text-slate-300 hover:text-white hover:bg-slate-800/60 transition-colors"
        title="Centro de notificaciones"
      >
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" />
          <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" />
        </svg>
        @if (storage.unreadNotificationsCount() > 0) {
          <span class="absolute top-1 right-1 w-2 h-2 rounded-full bg-indigo-500 animate-pulse"></span>
        }
      </button>

      <!-- Selector de Temas -->
      <div class="relative">
        <button
          (click)="toggleThemeDropdown()"
          class="flex items-center gap-1.5 px-2 py-1.5 rounded-lg border border-[#252834] bg-[#1a1c26] hover:bg-[#222533] text-xs text-slate-300 transition-colors"
        >
          <span>{{ activeThemeMeta.icon }}</span>
          <span class="hidden lg:inline text-[11px] font-medium">{{ activeThemeMeta.name }}</span>
          <svg class="w-3 h-3 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="6 9 12 15 18 9" />
          </svg>
        </button>

        @if (showThemeMenu()) {
          <div class="absolute right-0 mt-2 w-56 rounded-xl bg-[#161822] border border-[#2a2e3d] shadow-2xl py-1.5 z-50">
            <div class="px-3 py-1.5 text-[10px] font-bold text-slate-400 uppercase tracking-wider border-b border-[#252834]">
              Paleta del Sistema
            </div>
            @for (th of themes; track th.id) {
              <button
                (click)="selectTheme(th.id)"
                class="w-full px-3 py-2 text-left flex items-center justify-between text-xs hover:bg-[#1f2330] transition-colors"
                [class.text-indigo-400]="th.id === currentTheme"
                [class.text-slate-200]="th.id !== currentTheme"
              >
                <div class="flex items-center gap-2">
                  <span>{{ th.icon }}</span>
                  <div class="flex flex-col">
                    <span class="font-medium">{{ th.name }}</span>
                    <span class="text-[10px] text-slate-400">{{ th.label }}</span>
                  </div>
                </div>
                @if (th.id === currentTheme) {
                  <svg class="w-3.5 h-3.5 text-indigo-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <polyline points="20 6 9 17 4 12" />
                  </svg>
                }
              </button>
            }
          </div>
        }
      </div>

      <!-- Toggle Modo Demo -->
      <button
        (click)="toggleDemoMode.emit()"
        [class]="isDemoMode() ? 'bg-amber-500/20 text-amber-300 border-amber-500/30' : 'bg-slate-800/40 text-slate-400 border-slate-700/50'"
        class="border px-2.5 py-1 rounded-full text-[11px] font-semibold transition-all hover:scale-105"
        title="Alternar entre modo demo guiado y aplicación completa"
      >
        {{ isDemoMode() ? '⚡ Modo Demo' : 'App Completa' }}
      </button>
    </div>
  </div>

  <!-- Barra de Navegación Móvil -->
  <div class="md:hidden flex items-center justify-around border-t border-[#252834] bg-[#14161f] px-2 py-1.5">
    <button
      (click)="selectTab('roadmap')"
      [class.text-indigo-400]="currentTab() === 'roadmap'"
      [class.text-slate-400]="currentTab() !== 'roadmap'"
      class="flex flex-col items-center gap-0.5 text-[10px] font-medium"
    >
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" />
        <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" />
      </svg>
      <span>Rutas</span>
    </button>

    <button
      (click)="selectTab('planner')"
      [class.text-indigo-400]="currentTab() === 'planner'"
      [class.text-slate-400]="currentTab() !== 'planner'"
      class="flex flex-col items-center gap-0.5 text-[10px] font-medium"
    >
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
        <line x1="16" y1="2" x2="16" y2="6" />
        <line x1="8" y1="2" x2="8" y2="6" />
        <line x1="3" y1="10" x2="21" y2="10" />
      </svg>
      <span>Planificador</span>
    </button>

    <button
      (click)="selectTab('progress')"
      [class.text-indigo-400]="currentTab() === 'progress'"
      [class.text-slate-400]="currentTab() !== 'progress'"
      class="flex flex-col items-center gap-0.5 text-[10px] font-medium"
    >
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="20" x2="18" y2="10" />
        <line x1="12" y1="20" x2="12" y2="4" />
        <line x1="6" y1="20" x2="6" y2="14" />
      </svg>
      <span>Progreso</span>
    </button>

    <button
      (click)="selectTab('chat')"
      [class.text-indigo-400]="currentTab() === 'chat'"
      [class.text-slate-400]="currentTab() !== 'chat'"
      class="flex flex-col items-center gap-0.5 text-[10px] font-medium"
    >
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
      </svg>
      <span>Mentor IA</span>
    </button>
  </div>
</header>
